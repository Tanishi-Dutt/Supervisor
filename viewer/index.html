<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Recorder City</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<!--FR_CONFIG-->
<style>
  :root {
    --bg: #f4f6fa; --ink: #0f172a; --muted: #64748b; --line: #e6eaf0; --card: #ffffff; --soft: #f8fafc;
    --run: #6366f1; --recover: #f59e0b; --ok: #10b981; --stop: #94a3b8; --flag: #f43f5e;
    --veto: #e11d48; --gold: #f5b301; --sky: #38bdf8; --beam: rgba(56, 189, 248, .20);
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
    --shadow-lg: 0 2px 6px rgba(15,23,42,.05), 0 24px 60px rgba(15,23,42,.14);
    --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }

  header { height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 20px; background: rgba(255,255,255,.82); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); position: relative; z-index: 6; }
  .brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #6366f1, #38bdf8); display: grid; place-items: center; box-shadow: 0 6px 16px rgba(99,102,241,.35); }
  .brand h1 { font-size: 15px; margin: 0; letter-spacing: -.01em; line-height: 1.1; font-weight: 800; }
  .brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: .02em; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; font-weight: 700; font-size: 11px; letter-spacing: .06em; background: #eef1f5; color: var(--muted); flex-shrink: 0; }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 20%, transparent); }
  .pill.live { background: #dcfce7; color: #15803d; } .pill.live .dot { animation: blink 1.2s infinite; }
  .pill.offline { background: #ffe4e6; color: var(--veto); }
  .pill.complete { background: #e0e7ff; color: #4338ca; }
  .meta { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; font-family: var(--mono); }
  #controls { display: none; align-items: center; gap: 6px; flex-shrink: 0; background: #f1f4f9; border: 1px solid var(--line); padding: 4px; border-radius: 12px; }
  body.api #controls { display: flex; }
  body.api .legend > span { display: none; }
  #controls button { border: 0; background: transparent; border-radius: 9px; padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 650; cursor: pointer; color: var(--ink); transition: background .15s, opacity .15s; }
  #controls button:hover:not(:disabled) { background: #fff; box-shadow: var(--shadow); }
  #controls button.go { background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; box-shadow: 0 4px 12px rgba(79,70,229,.35); }
  #controls button.kill { color: var(--veto); }
  #controls button:disabled { opacity: .35; cursor: default; box-shadow: none; }
  #controls label { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; white-space: nowrap; padding: 0 6px; }
  #controls input { accent-color: #6366f1; }
  #status { font-size: 12px; color: var(--muted); max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 6px; }
  body.api .bot, body.api .agent { cursor: pointer; }
  .legend { margin-left: auto; display: flex; gap: 14px; color: var(--muted); font-size: 12px; align-items: center; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  header button#resbtn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 12px; font: inherit; font-size: 12px; font-weight: 650; cursor: pointer; box-shadow: var(--shadow); }

  #drawer { position: fixed; top: 64px; right: 0; bottom: 0; width: min(600px, 100%); background: var(--card); border-left: 1px solid var(--line); box-shadow: var(--shadow-lg); transform: translateX(105%); transition: transform .35s cubic-bezier(.2,.8,.2,1); overflow-y: auto; padding: 20px 26px 40px; z-index: 7; }
  #drawer.show { transform: none; }
  #drawer .close { float: right; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 5px 11px; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; }
  .md h1 { font-size: 20px; margin: 4px 0 12px; letter-spacing: -.01em; } .md h2 { font-size: 14px; margin: 22px 0 8px; } .md h3 { font-size: 13px; }
  .md p, .md li { font-size: 13px; } .md ul { padding-left: 18px; }
  .md table { border-collapse: collapse; width: 100%; font-size: 12px; margin: 6px 0; }
  .md th, .md td { border-bottom: 1px solid #f1f4f8; padding: 6px; text-align: left; vertical-align: top; }
  .md th { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; }
  .md code { background: #f1f4f9; padding: 1px 6px; border-radius: 5px; font: 11.5px var(--mono); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
  .md pre { font: 12px var(--mono); white-space: pre-wrap; }

  main { display: grid; grid-template-columns: 1fr 340px; height: calc(100% - 64px); }
  #stage { position: relative; overflow: hidden; background: radial-gradient(1200px 700px at 50% 35%, #ffffff 0%, #f3f6fb 55%, #e8edf5 100%); }
  #city { width: 100%; height: 100%; display: block; }
  aside { border-left: 1px solid var(--line); background: var(--soft); overflow-y: auto; padding: 16px; }
  aside h2 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 4px 2px 10px; font-weight: 700; }
  .agent { display: grid; grid-template-columns: 10px 1fr auto; gap: 3px 10px; align-items: center; padding: 10px 12px; margin-bottom: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 1px 2px rgba(15,23,42,.03); transition: transform .15s, box-shadow .15s; }
  .agent:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .agent .sw { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 0%, transparent); }
  .agent .nm { font-weight: 650; font-size: 13px; }
  .agent .st { font-size: 10px; font-weight: 750; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, currentColor 12%, transparent); }
  .agent .act { grid-column: 2 / 4; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); }
  .log { font: 11.5px/1.5 var(--mono); color: #334155; }
  .log div { padding: 7px 10px; margin-bottom: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .log .pin { background: #fff1f2; color: var(--veto); border-color: #fecdd3; box-shadow: inset 3px 0 0 var(--veto); }

  /* ---------- the agentic space ---------- */
  .island { fill: #fff; }
  .district { opacity: .07; }
  .bfront { fill: #fff; stroke: #e2e7ef; stroke-width: 1; }
  .bside { fill: #eef2f8; stroke: #e2e7ef; stroke-width: 1; }
  .bwin { opacity: .22; }
  .btag rect { fill: #fff; } .btag text { font-size: 12px; font-weight: 750; fill: var(--ink); }
  .btools { font-size: 10px; text-anchor: middle; fill: var(--muted); font-family: var(--mono); letter-spacing: .02em; }
  .road { stroke: #e9eef5; stroke-width: 18; stroke-linecap: round; fill: none; }
  .lane { stroke: #fff; stroke-width: 2; stroke-dasharray: 10 12; fill: none; animation: flow 1.6s linear infinite; }
  .packet { filter: drop-shadow(0 0 4px currentColor); }
  .pad { fill: #fff; stroke: #e2e7ef; stroke-width: 1; }
  .dock { fill: none; stroke: #e0e7ff; stroke-width: 2; }
  .padlabel { font-size: 12px; font-weight: 700; text-anchor: middle; fill: var(--ink); }
  .padnum { font-size: 9.5px; text-anchor: middle; fill: var(--muted); font-family: var(--mono); letter-spacing: .04em; }

  .mover { transition: transform .55s cubic-bezier(.45, 0, .2, 1); }
  .bob { animation: bob 1.8s ease-in-out infinite; }
  .bot .body { fill: var(--c, var(--run)); transition: fill .3s; }
  .bot .visor { fill: #0f172a; }
  .bot .eye { fill: color-mix(in srgb, var(--c, var(--run)) 35%, #fff); transition: fill .3s; }
  .bot .head { fill: #fff; stroke: color-mix(in srgb, var(--c, var(--run)) 45%, #fff); stroke-width: 1.5; transition: stroke .3s; }
  .bot .light { fill: var(--c, var(--run)); }
  .bot .num { fill: #fff; font-size: 9.5px; font-weight: 800; text-anchor: middle; }
  .bot.st-running { --c: var(--run); } .bot.st-recovering { --c: var(--recover); }
  .bot.st-recovered, .bot.st-success_untouched { --c: var(--ok); }
  .bot.st-stopped { --c: var(--stop); } .bot.st-flagged { --c: var(--flag); }
  .bot.st-stopped .bob, .bot.st-recovered .bob, .bot.st-success_untouched .bob { animation-duration: 3.4s; }
  .bot.st-flagged .light { animation: blink .5s infinite; }

  .bubble rect { fill: #fff; stroke: #e2e7ef; }
  .bubble text { font-size: 11px; fill: var(--ink); text-anchor: middle; font-weight: 550; }
  .bubble.err rect { stroke: #fecdd3; fill: #fff7f8; } .bubble.err text { fill: #be123c; }
  .bubble.ok rect { stroke: #bbf7d0; fill: #f6fef9; } .bubble.ok text { fill: #047857; }
  .bubble.stop text { fill: var(--muted); }
  .bubble.claim rect { stroke: var(--ok); stroke-width: 2; fill: #ecfdf5; } .bubble.claim text { fill: #065f46; font-weight: 750; font-size: 12px; }
  .evidence rect { fill: var(--veto); } .evidence text { fill: #fff; font-size: 11px; font-weight: 750; text-anchor: middle; }

  .drone .rotor { animation: spin .22s linear infinite; transform-box: fill-box; transform-origin: center; }
  .beam { fill: var(--beam); opacity: 0; transition: opacity .25s; }
  .beam.on { opacity: 1; }
  .ring { fill: none; stroke: var(--flag); stroke-width: 3; animation: ring 1s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .station .tile { fill: #fff; stroke: #e2e7ef; stroke-width: 1; transition: all .2s; }
  .station .glow { fill: none; stroke: transparent; stroke-width: 3; transition: stroke .2s; }
  .station.on .glow { stroke: var(--sky); } .station.on .tile { fill: #f0f9ff; }
  .station.veto .glow { stroke: var(--veto); } .station.veto .tile { fill: #fff1f2; }
  .station text { text-anchor: middle; }
  .flowline { stroke: #c7d2fe; stroke-width: 2; stroke-dasharray: 3 7; fill: none; animation: flow 1.2s linear infinite; }
  .tower-body { fill: #1e293b; transition: fill .4s; }
  .tower-side { fill: #0f172a; transition: fill .4s; }
  .beacon { fill: #22c55e; animation: blink 1s infinite; }
  .radar { fill: none; stroke: #6366f1; stroke-width: 1.5; animation: radar 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }

  body.offline #city .bots, body.offline #city .bubbles { filter: grayscale(.9) opacity(.55); }
  body.offline .bob, body.offline .drone .rotor, body.offline .beacon, body.offline .lane, body.offline .flowline { animation-play-state: paused; }
  body.offline .radar, body.offline .packet { display: none; }
  body.offline .beacon { fill: #94a3b8; }
  body.offline .tower-body, body.offline .tower-side { fill: #94a3b8; }

  #banner { position: absolute; left: 50%; top: 18px; transform: translate(-50%, -250%); padding: 11px 20px; border-radius: 999px; font-weight: 750; font-size: 14px; box-shadow: var(--shadow-lg); transition: transform .4s cubic-bezier(.2,.9,.3,1.2); white-space: nowrap; letter-spacing: .01em; backdrop-filter: blur(8px); }
  #banner.show { transform: translate(-50%, 0); }
  #banner.down { background: linear-gradient(135deg, #f43f5e, #e11d48); color: #fff; }
  #banner.up { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
  #banner.wait { background: rgba(255,255,255,.9); color: var(--muted); border: 1px solid var(--line); }

  .card { position: absolute; width: 300px; background: rgba(255,255,255,.96); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(8px) scale(.98); transition: opacity .2s, transform .25s; pointer-events: none; backdrop-filter: blur(8px); }
  .card.show { opacity: 1; transform: none; }
  .card .flag { font-weight: 800; color: var(--flag); font-size: 11.5px; letter-spacing: .05em; }
  .card .detail { color: var(--muted); font-size: 12px; margin: 3px 0 9px; }
  .card .row { font-size: 13px; padding: 6px 0; border-top: 1px solid #f1f4f8; }
  .card .row.policy { opacity: 0; transition: opacity .2s; } .card.policy .row.policy { opacity: 1; }
  .card .ok { color: #047857; font-weight: 750; } .card .no { color: var(--veto); font-weight: 850; }
  .stamp { position: absolute; right: 10px; bottom: 6px; transform: rotate(-12deg) scale(2); opacity: 0; color: var(--veto); border: 3px solid var(--veto); border-radius: 8px; padding: 2px 9px; font-weight: 900; font-size: 18px; letter-spacing: .1em; transition: all .25s cubic-bezier(.2, 1.6, .4, 1); background: rgba(255,255,255,.9); }
  .card.vetoed .stamp { opacity: 1; transform: rotate(-12deg) scale(1); }

  #results { position: fixed; inset: 0; background: rgba(15,23,42,.32); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 8; }
  #results.show { opacity: 1; pointer-events: auto; }
  #results .panel { background: var(--card); border-radius: 20px; padding: 26px 30px; box-shadow: var(--shadow-lg); max-width: calc(100% - 32px); overflow-x: auto; }
  #results h3 { margin: 0 0 14px; font-size: 20px; letter-spacing: -.01em; }
  #results table { border-collapse: collapse; font-size: 14px; }
  #results th, #results td { padding: 9px 14px; text-align: left; border-bottom: 1px solid #f1f4f8; white-space: nowrap; }
  #results tr:hover td { background: #f8fafc; }
  #results th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  #results td.n { text-align: right; font-variant-numeric: tabular-nums; }
  #results .sum { margin-top: 16px; font-weight: 750; padding: 10px 14px; background: #eef2ff; color: #3730a3; border-radius: 12px; display: inline-block; }
  #results .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }

  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 50% { opacity: .35; } }
  @keyframes ring { from { transform: scale(.7); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
  @keyframes radar { from { transform: scale(.4); opacity: .55; } to { transform: scale(1.6); opacity: 0; } }
  @keyframes flow { to { stroke-dashoffset: -22; } }

  @media (max-width: 1100px) { .meta { display: none; } }
  @media (max-width: 900px) {
    body { overflow: auto; }
    header { height: auto; flex-wrap: wrap; padding: 10px 16px; }
    main { grid-template-columns: 1fr; height: auto; }
    #stage { height: 62vh; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    .legend { display: none; }
    #drawer { top: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></div>
    <div><h1>Flight Recorder</h1><small>agentic space · live</small></div>
  </div>
  <span id="pill" class="pill"><span class="dot"></span><span id="pilltext">WAITING</span></span>
  <span id="meta" class="meta"></span>
  <div id="controls">
    <button id="startbtn" class="go">▶ Start run</button>
    <label><input type="checkbox" id="realchk"> + real coder agent</label>
    <button id="killbtn" class="kill" disabled title="Sends SIGKILL to the supervisor process">☠ Kill supervisor</button>
    <button id="resumebtn" disabled>↻ Resume</button>
    <span id="status"></span>
  </div>
  <div class="legend">
    <span><i style="background:var(--run)"></i>worker agent</span>
    <span><i style="background:#1e293b"></i>supervisor</span>
    <span><i style="background:var(--flag)"></i>caught</span>
    <button id="resbtn" hidden>Results (R)</button>
  </div>
</header>
<main>
  <div id="stage">
    <svg id="city" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" aria-label="Agent city"></svg>
    <div id="banner"></div>
    <div id="card" class="card"></div>
  </div>
  <aside>
    <h2>Agents</h2>
    <div id="agents"></div>
    <h2 style="margin-top:18px">Supervisor log</h2>
    <div id="log" class="log"></div>
  </aside>
</main>
<div id="results"><div class="panel"></div></div>
<div id="drawer"><button class="close" id="drawerclose">✕ Close</button><div id="drawerbody" class="md"></div></div>

<script>
const NS = "http://www.w3.org/2000/svg";
const API = typeof window.FR_API === "string" ? window.FR_API.replace(/\/$/, "") : null;  // set by the website's config.js
let runId = API === null ? null : new URLSearchParams(location.search).get("run");
const BUILDINGS = [
  { id: "library",  x: 170,  label: "Library",  tools: "search",            icon: "📚", color: "#8b5cf6" },
  { id: "archive",  x: 385,  label: "Archive",  tools: "read_file · list_dir", icon: "🗄️", color: "#64748b" },
  { id: "workshop", x: 600,  label: "Workshop", tools: "edit · patch",      icon: "🔧", color: "#f97316" },
  { id: "lab",      x: 815,  label: "Test Lab", tools: "run_tests · lint",  icon: "🧪", color: "#06b6d4" },
  { id: "network",  x: 1030, label: "Network",  tools: "fetch · call_api",  icon: "📡", color: "#ec4899" },
];
const ACTION_TO_BUILDING = { search: "library", read_file: "archive", list_dir: "archive", edit: "workshop",
  patch: "workshop", run_tests: "lab", lint: "lab", fetch: "network", call_api: "network" };
const BASE_Y = 280;                       // building bottom edge
const AVENUE_Y = 410;
const TOWER = { x: 600, y: 630 };         // tower base
const DRONE_HOME = { x: 600, y: 424 };
const STATION_Y = 560;
const PAD_Y = 742;
let N = 7;  // agent count; 8 with --real
const padX = i => 120 + (i - 1) * 960 / (N - 1);
const homePos = i => ({ x: padX(i), y: PAD_Y - 30 });
const slotPos = (b, i) => ({ x: b.x + (i - (N + 1) / 2) * Math.min(28, 168 / (N - 1)),
                             y: BASE_Y + 52 + (i % 2 ? 0 : 26) });
const STATUS_COLOR = { running: "var(--run)", recovering: "var(--recover)", recovered: "var(--ok)",
  success_untouched: "var(--ok)", stopped: "var(--stop)", flagged: "var(--flag)" };
const STATUS_LABEL = { running: "running", recovering: "recovering", recovered: "recovered",
  success_untouched: "done · untouched", stopped: "stopped", flagged: "caught" };

const svg = document.getElementById("city");
const stage = document.getElementById("stage");
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const short = (s, n) => (s.length > n ? s.slice(0, n - 1) + "…" : s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- static scene: a floating island city ----------
const defs = el("defs", {}, svg);
const soft = el("filter", { id: "soft", x: "-30%", y: "-30%", width: "160%", height: "180%" }, defs);
el("feDropShadow", { dx: 0, dy: 8, stdDeviation: 10, "flood-color": "#0f172a", "flood-opacity": .08 }, soft);
const softSm = el("filter", { id: "softsm", x: "-30%", y: "-40%", width: "160%", height: "200%" }, defs);
el("feDropShadow", { dx: 0, dy: 3, stdDeviation: 4, "flood-color": "#0f172a", "flood-opacity": .10 }, softSm);
const pat = el("pattern", { id: "dots", width: 22, height: 22, patternUnits: "userSpaceOnUse" }, defs);
el("circle", { cx: 2, cy: 2, r: 1.1, fill: "#e6ebf2" }, pat);

el("rect", { class: "island", x: 30, y: 60, width: 1140, height: 728, rx: 36, filter: "url(#soft)" }, svg);
el("rect", { x: 30, y: 60, width: 1140, height: 728, rx: 36, fill: "url(#dots)" }, svg);
for (const b of BUILDINGS) el("rect", { class: "district", x: b.x - 100, y: 92, width: 200, height: 292, rx: 26, fill: b.color }, svg);

const roads = el("g", {}, svg);
const AVENUE = `M70 ${AVENUE_Y} H1130`;
el("path", { class: "road", d: AVENUE }, roads);
for (const b of BUILDINGS) el("path", { class: "road", d: `M${b.x} ${BASE_Y} V${AVENUE_Y}` }, roads);
const padRoads = el("g", {}, roads);

  const bubble = el("g", { class: "mover" }, bubblesLayer);
  g.addEventListener("click", () => openReport(i));
  bots[i] = { g, badge, bubble, pos: homePos(i) };
  place(i, homePos(i), true);
}
function place(i, p, instant) {
  const b = bots[i];
  for (const n of [b.g, b.bubble]) {
    if (instant) n.style.transition = "none";
    n.style.transform = `translate(${p.x}px, ${p.y}px)`;
    if (instant) { n.getBoundingClientRect(); n.style.transition = ""; }
  }
  b.pos = p;
}

function targetFor(a) {
  if (!a.action || ["stopped", "recovered", "success_untouched"].includes(a.status)) return homePos(a.index);
  const b = BUILDINGS.find(b => b.id === (ACTION_TO_BUILDING[a.action] || "archive"));
  return slotPos(b, a.index);
}

function bubbleFor(a) {
  if (a.status === "stopped") return { text: "🛑 stopped", cls: "stop" };
  if (a.status === "recovered") return { text: "recovered ✓", cls: "ok" };
  if (a.status === "success_untouched") return { text: "done ✓ untouched", cls: "ok" };
  if (a.claimed && !a.passed) return { text: `“${a.claimed}”`, cls: "claim", evidence: "evidence: tests FAILED ✗" };
  if (!a.action) return null;
  const r = a.result || "";
  if (/timeout/i.test(r)) return { text: "⏳ timeout", cls: "err" };
  if (/429/.test(r)) return { text: "🚦 429 rate limited", cls: "err" };
  if (/failed|not found|failing/i.test(r)) return { text: short(r, 22), cls: "err" };
  return { text: short(`${a.action}`, 18), cls: "" };
}

function drawBubble(i, spec) {
  const g = bots[i].bubble;
  g.replaceChildren();
  if (!spec) return;
  const y = -58;
  const bg = el("g", { class: `bubble ${spec.cls}` }, g);
  const rect = el("rect", { y: y - 15, height: 22, rx: 11, filter: "url(#softsm)" }, bg);
  const t = el("text", { y: y }, bg);
  t.textContent = spec.text;
  const w = t.getComputedTextLength() + 16;
  rect.setAttribute("x", -w / 2); rect.setAttribute("width", w);
  if (spec.evidence) {
    const ev = el("g", { class: "evidence" }, g);
    const er = el("rect", { y: y - 41, height: 20, rx: 6 }, ev);
    const et = el("text", { y: y - 27 }, ev);
    et.textContent = spec.evidence;
    const ew = et.getComputedTextLength() + 14;
    er.setAttribute("x", -ew / 2); er.setAttribute("width", ew);
  }
}

const BADGE = { stopped: "", recovered: "✅", success_untouched: "⭐" };
function renderBot(a) {
  if (!bots[a.index]) makeBot(a.index);
  const view = visiting.has(a.index) ? { ...a, status: "flagged" } : a;
  const b = bots[a.index];
  b.g.setAttribute("class", `bot mover st-${view.status}`);
  b.badge.textContent = BADGE[view.status] || "";
  drawBubble(a.index, bubbleFor(view));
  place(a.index, targetFor(view));
}

// ---------- supervisor visits (one flag at a time) ----------
const queue = [];
const visiting = new Set();
let busy = false;
const card = document.getElementById("card");

function toStage(x, y) {
  const pt = svg.createSVGPoint(); pt.x = x; pt.y = y;
  const s = pt.matrixTransform(svg.getScreenCTM());
  const r = stage.getBoundingClientRect();
  return { x: s.x - r.left, y: s.y - r.top };
}

async function runQueue() {
  if (busy) return;
  busy = true;
  while (queue.length) {
    while (document.body.classList.contains("offline")) await sleep(200);
    const job = queue.shift();
    // Keep up with real time when flags pile up; the liar's veto always gets full time.
    await visit(job, job.ev.vetoed ? 1 : queue.length ? .6 : 1);
  }
  moveDrone(DRONE_HOME);
  busy = false;
}

async function visit({ idx, name, ev }, f) {
  const p = bots[idx].pos;
  bubblesLayer.appendChild(bots[idx].bubble);  // flagged bot's bubble on top
  const side = p.x > 1080 ? -1 : 1;
  const d = { x: p.x + side * 62, y: p.y - 26 };
  moveDrone(d);
  await sleep(550 * f);
  beam.setAttribute("points", `${d.x - 7},${d.y + 8} ${d.x + 7},${d.y + 8} ${p.x + 15},${p.y + 18} ${p.x - 15},${p.y - 26}`);
  beam.classList.add("on");
  const ring = el("circle", { class: "ring", cx: p.x, cy: p.y - 6, r: 30 }, effects);

  const below = p.y < 500;
  const s = toStage(p.x, below ? p.y + 34 : p.y - 110);
  card.style.left = `${Math.max(8, Math.min(stage.clientWidth - 308, s.x - 150))}px`;
  card.style.top = below ? `${s.y}px` : "";
  card.style.bottom = below ? "" : `${stage.clientHeight - s.y}px`;
  card.className = "card";
  card.innerHTML = `
    <div class="flag">⚠ ${esc(ev.flag.toUpperCase())} · #${idx} ${esc(name)} · step ${ev.step}</div>
    <div class="detail">${esc(ev.detail)}</div>
    <div class="row">🧠 LLM proposes <b>${esc(ev.proposed ?? "—")}</b></div>
    <div class="row policy">🛡️ Policy: ${ev.vetoed
      ? `<span class="no">VETO</span> → <b>${esc(ev.action)}</b>`
      : `<span class="ok">✓ approved</span> → <b>${esc(ev.action)}</b>`}</div>
    <div class="stamp">VETOED</div>`;
  requestAnimationFrame(() => card.classList.add("show"));
  brain.classList.add("on");
  await sleep(550 * f);
  brain.classList.remove("on");
  shield.classList.add(ev.vetoed ? "veto" : "on");
  card.classList.add("policy");
  if (ev.vetoed) { await sleep(350 * f); card.classList.add("vetoed"); }
  await sleep((ev.vetoed ? 2400 : 750) * f);

  shield.classList.remove("on", "veto");
  card.classList.remove("show");
  beam.classList.remove("on");
  ring.remove();
  visiting.delete(idx);
  if (latest[idx]) renderBot(latest[idx]);
}

// ---------- data ----------
let snap = null, alive = false, wasOffline = false, prevEvents = {}, resultsShown = false;
const latest = {};
const banner = document.getElementById("banner");
let bannerTimer = null;
function showBanner(text, cls, ms) {
  banner.textContent = text; banner.className = `show ${cls}`;
  clearTimeout(bannerTimer);
  if (ms) bannerTimer = setTimeout(() => (banner.className = cls), ms);
}
function hideBanner() { banner.className = ""; }

function resetSession(s) {
  if (s.agents.length !== N) layoutPads(s.agents.length);
  queue.length = 0; visiting.clear(); prevEvents = {}; resultsShown = false;
  document.getElementById("results").classList.remove("show");
  document.getElementById("resbtn").hidden = true;
  for (const a of s.agents) {
    prevEvents[a.index] = a.events;
    if (!bots[a.index]) makeBot(a.index);
    place(a.index, targetFor(a), true);
  }
}

function update(s) {
  if (!snap || snap.session !== s.session) resetSession(s);
  for (const a of s.agents) {
    document.getElementById(`padlabel${a.index}`).textContent = a.name;
    if (a.name === "Real coder") document.getElementById(`padnum${a.index}`).textContent = `#${a.index} · real files + pytest`;
    if (a.events > (prevEvents[a.index] ?? a.events) && a.last_event) {
      visiting.add(a.index);
      queue.push({ idx: a.index, name: a.name, ev: a.last_event });
    }
    prevEvents[a.index] = a.events;
    latest[a.index] = a;
    renderBot(a);
  }
  snap = s;
  renderSide(s);
  evaluateMode();
  runQueue();
  if (s.finished && !resultsShown) { resultsShown = true; showResultsWhenIdle(); }
}

function renderSide(s) {
  document.getElementById("meta").textContent =
    `session ${s.session}` + (s.faked.length ? ` · fakes: ${[...new Set(s.faked.map(f => f.split(".")[0]))].join(", ")}` : "");
  document.getElementById("agents").innerHTML = s.agents.map(a => `
    <div class="agent" onclick="openReport(${a.index})">
      <span class="sw" style="background:${STATUS_COLOR[a.status]}"></span>
      <span class="nm">#${a.index} ${esc(a.name)}</span>
      <span class="st" style="color:${STATUS_COLOR[a.status]}">${STATUS_LABEL[a.status]}</span>
      <span class="act">step ${a.step} · ${a.action ? esc(a.action + ": " + a.result) : "waiting"}</span>
    </div>`).join("");
  document.getElementById("log").innerHTML =
    s.pinned.map(m => `<div class="pin">${esc(m)}</div>`).join("") +
    s.log.slice().reverse().map(m => `<div>${esc(m)}</div>`).join("");
}

function evaluateMode() {
  const pill = document.getElementById("pill"), txt = document.getElementById("pilltext");
  let mode = !snap ? "waiting" : snap.finished ? "complete" : alive ? "live" : "offline";
  pill.className = `pill ${mode}`;
  txt.textContent = { waiting: "WAITING", live: "LIVE", offline: "SUPERVISOR DOWN", complete: "RUN COMPLETE" }[mode];
  document.body.classList.toggle("offline", mode === "offline");
  if (mode === "waiting") showBanner(API === null ? "Waiting for supervisor… run python3 run_demo.py --viewer"
    : runId ? "Starting the supervisor…" : "Press ▶ Start run to launch the supervisor and its agents", "wait");
  else if (mode === "offline") {
    if (!wasOffline) {
      showBanner("⚠ SUPERVISOR KILLED — agents frozen at last checkpoint", "down");
      moveDrone(DRONE_HOME);
      card.classList.remove("show");
      beam.classList.remove("on");
    }
    wasOffline = true;
  } else if (wasOffline && alive && snap.resumed_at != null) {
    wasOffline = false;
    showBanner(`↻ SUPERVISOR RESUMED from checkpoint · step ${snap.resumed_at}`, "up", 5000);
  } else if (mode === "live" || mode === "complete") {
    if (wasOffline) { wasOffline = false; }
    if (banner.classList.contains("wait") || banner.classList.contains("down")) hideBanner();
  }
}

async function showResultsWhenIdle() {
  const session = snap.session;
  while (busy || queue.length) await sleep(300);
  await sleep(1200);
  if (snap.session !== session || !snap.finished) return;
  renderResults(); document.getElementById("results").classList.add("show");
  document.getElementById("resbtn").hidden = false;
}
function renderResults() {
  if (!snap?.results) return;
  document.querySelector("#results .panel").innerHTML = `
    <h3>Results</h3>
    <table><tr><th>Agent</th><th>Expected</th><th>Actual</th><th></th><th>Steps to detect</th><th>Interventions</th><th>Vetoes</th><th>Wasted calls saved</th></tr>
    ${snap.results.map((r, k) => `<tr onclick="openReport(${k + 1})" style="cursor:pointer"><td>${esc(r.agent)}</td><td>${r.expected}</td><td>${r.actual}</td><td>${r.ok ? "✅" : "❌"}</td>
      <td class="n">${r.detect ?? "—"}</td><td class="n">${r.interventions}</td><td class="n">${r.vetoes}</td><td class="n">${r.saved}</td></tr>`).join("")}
    </table>
    <div class="sum">${esc(snap.summary)}</div>
    <div class="hint">${API === null ? "" : "Click an agent for its black-box report · "}Click anywhere or press R to toggle</div>`;
}
document.getElementById("results").addEventListener("click", () => document.getElementById("results").classList.remove("show"));
document.getElementById("resbtn").addEventListener("click", () => { renderResults(); document.getElementById("results").classList.add("show"); });
addEventListener("keydown", e => { if (e.key === "r" || e.key === "R") { renderResults(); document.getElementById("results").classList.toggle("show"); } });

async function poll() {
  try {
    const r = await fetch(`live.json?t=${Date.now()}`, { cache: "no-store" });
    if (r.ok) update(await r.json());
  } catch (e) { /* not written yet */ }
  setTimeout(poll, 300);
}
async function heartbeat() {
  let ok = false;
  try {
    const r = await fetch(`heartbeat.json?t=${Date.now()}`, { cache: "no-store" });
    if (r.ok) ok = Date.now() / 1000 - (await r.json()).ts < 2;
  } catch (e) { /* missing */ }
  alive = ok;
  evaluateMode();
  setTimeout(heartbeat, 500);
}
// ---------- website mode: talk to server/app.py ----------
let procAlive = false, starting = false;
const $ = id => document.getElementById(id);
const setStatus = t => { $("status").textContent = t; $("status").title = t; };

async function api(path, method = "POST", body) {
  const r = await fetch(`${API}${path}`, { method, cache: "no-store",
    headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || `server error ${r.status}`);
  return d;
}
function setRun(id) {
  runId = id;
  const url = new URL(location.href);
  id ? url.searchParams.set("run", id) : url.searchParams.delete("run");
  history.replaceState(null, "", url);
}
function syncControls() {
  const running = !!runId && procAlive;
  $("startbtn").disabled = starting || running;
  $("killbtn").disabled = !running || !snap || snap.finished;
  $("resumebtn").disabled = !runId || running || !snap || snap.finished;
}
async function pollApi() {
  if (runId) {
    try {
      const r = await fetch(`${API}/api/runs/${runId}`, { cache: "no-store" });
      if (r.status === 404) { setRun(null); snap = null; procAlive = false; setStatus("That run expired. Start a new one."); }
      else if (r.ok) {
        const d = await r.json();
        alive = d.alive; procAlive = d.process === "running";
        if (d.snapshot) update(d.snapshot); else evaluateMode();
      }
    } catch (e) { setStatus("Can't reach the server (free hosting may be waking up), retrying…"); }
  }
  syncControls();
  setTimeout(pollApi, 400);
}
$("startbtn").addEventListener("click", async () => {
  starting = true; syncControls(); setStatus("Starting…");
  try {
    const d = await api("/api/runs", "POST", { real: $("realchk").checked });
    snap = null; procAlive = true; alive = false; wasOffline = false;
    $("results").classList.remove("show"); $("drawer").classList.remove("show");
    setRun(d.id); evaluateMode();
    setStatus("Running. Try killing the supervisor mid-run.");
  } catch (e) { setStatus(e.message); }
  starting = false; syncControls();
});
$("killbtn").addEventListener("click", async () => {
  try { const d = await api(`/api/runs/${runId}/kill`); setStatus(`kill -9 sent to PID ${d.killed}: no warning, no cleanup.`); }
  catch (e) { setStatus(e.message); }
});
$("resumebtn").addEventListener("click", async () => {
  try { await api(`/api/runs/${runId}/resume`); setStatus("Relaunched: resuming from the SQLite checkpoint."); }
  catch (e) { setStatus(e.message); }
});
$("drawerclose").addEventListener("click", () => $("drawer").classList.remove("show"));

async function openReport(i) {
  if (API === null || !runId) return;
  $("drawer").classList.add("show");
  $("drawerbody").innerHTML = "<p>Loading black box…</p>";
  try {
    const d = await api(`/api/runs/${runId}/report/${i}`, "GET");
    $("drawerbody").innerHTML = d.format === "md" ? md(d.text)
      : `<pre>${esc(d.format === "json" ? JSON.stringify(JSON.parse(d.text), null, 2) : d.text)}</pre>`;
  } catch (e) { $("drawerbody").innerHTML = `<p>${esc(e.message)}</p>`; }
}

// Minimal markdown for incident reports: headings, tables, lists, rules, `code`, **bold**.
function md(src) {
  const inline = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  const lines = src.split("\n"), out = [];
  for (let i = 0; i < lines.length;) {
    const l = lines[i];
    if (/^\s*\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push("<table>" + body.map((r, k) => `<tr>${cells(r).map(c => k ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join("")}</tr>`).join("") + "</table>");
      continue;
    }
    if (/^\s*[-*] /.test(l)) {
      const items = [];
      while (i < lines.length && /^\s*[-*] /.test(lines[i])) items.push(`<li>${inline(lines[i++].replace(/^\s*[-*] /, ""))}</li>`);
      out.push(`<ul>${items.join("")}</ul>`);
      continue;
    }
    const h = l.match(/^(#{1,6}) (.*)/);
    if (h) out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);
    else if (/^---+\s*$/.test(l)) out.push("<hr>");
    else if (l.trim()) out.push(`<p>${inline(l)}</p>`);
    i++;
  }
  return out.join("");
}

layoutPads(7);
evaluateMode();
if (API !== null) { document.body.classList.add("api"); pollApi(); }
else { poll(); heartbeat(); }
